<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #050816;
            --bg-mid: #0a1030;
            --bg-purple: #1a0d3b;
            --text: #f8fafc;
            --muted: rgba(226, 232, 240, 0.72);
            --line: rgba(255, 255, 255, 0.10);
            --line-soft: rgba(255, 255, 255, 0.06);
            --glass: rgba(255, 255, 255, 0.04);
            --blue: #1fb6ff;
            --indigo: #6a5cff;
            --violet: #a855f7;
            --pink: #e879f9;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 18% 45%, rgba(31, 182, 255, 0.22), transparent 18%),
                radial-gradient(circle at 82% 72%, rgba(168, 85, 247, 0.20), transparent 20%),
                radial-gradient(circle at 70% 20%, rgba(106, 92, 255, 0.12), transparent 18%),
                linear-gradient(135deg, #02040f 0%, #071127 35%, #100a2b 70%, #050816 100%);
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }

        body::before {
            width: 340px;
            height: 340px;
            left: -80px;
            top: 30%;
            background: rgba(20, 163, 255, 0.18);
        }

        body::after {
            width: 360px;
            height: 360px;
            right: -100px;
            bottom: 10%;
            background: rgba(192, 38, 211, 0.18);
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px;
            position: relative;
            z-index: 1;
        }

        .shell {
            width: min(1180px, 100%);
            min-height: 760px;
            border-radius: 34px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.09);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.02));
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.02),
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 0 50px rgba(110, 86, 255, 0.12);
            backdrop-filter: blur(20px);
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 45%, rgba(0, 153, 255, 0.18), transparent 22%),
                radial-gradient(circle at 82% 80%, rgba(217, 70, 239, 0.16), transparent 20%),
                radial-gradient(circle at 70% 25%, rgba(124, 58, 237, 0.10), transparent 20%);
            pointer-events: none;
        }

        .shell::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(rgba(255, 255, 255, 0.12) 0.8px, transparent 0.8px);
            background-size: 24px 24px;
            opacity: 0.06;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            pointer-events: none;
        }

        .orb-left,
        .orb-right {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.9;
        }

        .orb-left {
            width: 340px;
            height: 340px;
            left: -120px;
            top: 44%;
            background:
                radial-gradient(circle at 60% 50%, rgba(27, 178, 255, 0.85), rgba(27, 178, 255, 0.18) 40%, transparent 70%);
            filter: blur(18px);
        }

        .orb-right {
            width: 360px;
            height: 360px;
            right: -120px;
            bottom: 5%;
            background:
                radial-gradient(circle at 40% 50%, rgba(217, 70, 239, 0.72), rgba(168, 85, 247, 0.18) 42%, transparent 72%);
            filter: blur(22px);
        }

        .topbar {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 34px 42px 0 42px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            position: relative;
            background: linear-gradient(135deg, rgba(31, 182, 255, 0.18), rgba(168, 85, 247, 0.18));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 0 20px rgba(31, 182, 255, 0.18),
                0 0 24px rgba(168, 85, 247, 0.12);
        }

        .brand-mark::before {
            content: "T";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.35rem;
            background: linear-gradient(90deg, var(--blue), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand span:last-child {
            background: linear-gradient(90deg, #ffffff, #8ab4ff 60%, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid var(--line-soft);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(241, 245, 249, 0.78);
            font-size: 0.95rem;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.01);
        }

        .status-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #60a5fa;
            box-shadow: 0 0 12px #60a5fa;
        }

        .hero {
            position: relative;
            z-index: 2;
            min-height: calc(760px - 88px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px 70px;
        }

        .hero-inner {
            width: 100%;
            max-width: 860px;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: 999px;
            border: 1px solid rgba(126, 94, 255, 0.45);
            color: rgba(241, 245, 249, 0.92);
            letter-spacing: 0.22em;
            font-size: 0.95rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, rgba(31, 182, 255, 0.08), rgba(168, 85, 247, 0.08));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 0 28px rgba(138, 92, 246, 0.14);
            margin-bottom: 30px;
        }

        h1 {
            font-size: clamp(3.4rem, 7vw, 6.4rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -2.5px;
            margin-bottom: 26px;
        }

        .headline-main {
            display: block;
            color: #f8fafc;
        }

        .headline-accent {
            display: block;
            background: linear-gradient(90deg, var(--blue), #7c8cff 55%, var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            max-width: 720px;
            margin: 0 auto 42px;
            font-size: 1.28rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .cta-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            margin-bottom: 34px;
        }

        .btn {
            min-width: 280px;
            padding: 19px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.15rem;
            transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary {
            color: white;
            background: linear-gradient(90deg, #14b7ff, #6a5cff 55%, #c026d3);
            box-shadow:
                0 0 30px rgba(20, 183, 255, 0.24),
                0 0 42px rgba(192, 38, 211, 0.16);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 38px rgba(20, 183, 255, 0.30),
                0 0 54px rgba(192, 38, 211, 0.20);
        }

        .btn-secondary {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(66, 172, 255, 0.45);
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.02);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 24px rgba(66, 172, 255, 0.14);
        }

        .divider {
            max-width: 470px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            color: rgba(241, 245, 249, 0.65);
            font-size: 1rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
        }

        .sub-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .text-link {
            color: rgba(214, 224, 255, 0.86);
            text-decoration: none;
            font-size: 1.04rem;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .text-link:hover {
            color: white;
            text-shadow: 0 0 14px rgba(96, 165, 250, 0.35);
        }

        .separator {
            color: rgba(255, 255, 255, 0.22);
        }

        .bottom-wave {
            position: absolute;
            left: -4%;
            bottom: -26px;
            width: 108%;
            height: 170px;
            background:
                radial-gradient(120% 120% at 25% 100%, rgba(20, 183, 255, 0.18), transparent 46%),
                radial-gradient(120% 120% at 75% 100%, rgba(217, 70, 239, 0.16), transparent 42%);
            filter: blur(12px);
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .topbar {
                flex-direction: column;
                gap: 18px;
                padding: 28px 24px 0;
            }

            .hero {
                padding: 20px 20px 50px;
            }

            .btn {
                min-width: 240px;
                width: 100%;
                max-width: 420px;
            }

            .cta-row {
                gap: 16px;
            }

            .subtitle {
                font-size: 1.08rem;
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 16px;
            }

            .shell {
                min-height: auto;
                border-radius: 24px;
            }

            .brand {
                font-size: 1.55rem;
            }

            .status-pill {
                font-size: 0.86rem;
                padding: 10px 14px;
            }

            .eyebrow {
                font-size: 0.78rem;
                letter-spacing: 0.16em;
                padding: 12px 18px;
            }

            h1 {
                letter-spacing: -1.5px;
            }

            .subtitle {
                margin-bottom: 32px;
            }

            .sub-links {
                flex-direction: column;
                gap: 10px;
            }

            .separator {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <main class="shell">
            <div class="orb-left"></div>
            <div class="orb-right"></div>
            <div class="bottom-wave"></div>

            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark"></span>
                    <span>TaskFlow</span>
                </div>

                <div class="status-pill">Stay focused. Get things done.</div>
            </header>

            <section class="hero">
                <div class="hero-inner">
                    <div class="eyebrow">Welcome to TaskFlow</div>

                    <h1>
                        <span class="headline-main">Productivity,</span>
                        <span class="headline-accent">Simplified.</span>
                    </h1>

                    <p class="subtitle">
                        TaskFlow helps you stay organized, move faster, and keep everything in one place
                        with a clean experience built for everyday use.
                    </p>

                    <div class="cta-row">
                        <a href="/login" class="btn btn-primary">Login</a>
                        <a href="/register" class="btn btn-secondary">Create Account</a>
                    </div>

                    <p class="subtitle" style="margin-top: 10px; opacity: 0.6; font-size: 1rem;">
                        Clean. Focused. Built for everyday productivity.
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
