<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - TaskFlow</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #111827;
            --border: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #818cf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 20%), radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.12), transparent 18%), linear-gradient(180deg, #020617 0%, #0b1122 100%);
        }

        .page {
            padding: 24px;
            max-width: 980px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 28px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            border-radius: 24px;
            margin-bottom: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.7rem;
        }

        .panel {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: grid;
            gap: 18px;
        }

        .card {
            padding: 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(148, 163, 184, 0.12);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.06);
        }

        .card h3 {
            margin: 0 0 8px;
        }

        .card p {
            margin: 0;
            color: var(--muted);
        }

        .btn {
            border: none;
            border-radius: 999px;
            color: white;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <div class="brand">
                <div class="chip">TaskFlow</div>
                <div>
                    <h1>App settings</h1>
                    <small>Manage your profile, preferences, and navigation.</small>
                </div>
            </div>
            <a class="btn" href="/dashboard">Dashboard</a>
        </header>

        <section class="panel">
            <button class="card" type="button" onclick="location.href='/profile'">
                <h3>Account</h3>
                <p>Update your username, email, and password.</p>
            </button>

            <button class="card" type="button" onclick="location.href='/dashboard'">
                <h3>Chat settings</h3>
                <p>Open the dashboard and select a chat to access message and chat controls.</p>
            </button>

            <div class="card">
                <h3>Help & info</h3>
                <p>Need more features? Use the dashboard actions to manage chats, tasks, and participants.</p>
            </div>
        </section>
    </div>
</body>

</html>
