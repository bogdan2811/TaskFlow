<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account - TaskFlow</title>
    <style>
        :root {
            --bg: #050816;
            --text: #f8fafc;
            --muted: #a6adbb;
            --line: rgba(255, 255, 255, 0.09);
            --field: rgba(255, 255, 255, 0.055);
            --cyan: #16c7e8;
            --blue: #4f7cff;
            --violet: #7c3aed;
            --danger: #fb7185;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 18%, rgba(22, 199, 232, 0.18), transparent 24%),
                radial-gradient(circle at 88% 15%, rgba(124, 58, 237, 0.22), transparent 28%),
                radial-gradient(circle at 50% 115%, rgba(59, 130, 246, 0.10), transparent 32%),
                linear-gradient(135deg, #050816 0%, #080d1d 48%, #11071f 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 26px 26px;
            opacity: 0.035;
            pointer-events: none;
        }

        .page {
            height: 100vh;
            display: grid;
            place-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .card {
            width: min(100%, 600px);
            padding: 20px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(140deg, rgba(10, 16, 32, 0.94), rgba(9, 12, 27, 0.82) 56%, rgba(20, 11, 43, 0.76));
            border: 1px solid rgba(255, 255, 255, 0.075);
            box-shadow:
                0 42px 120px rgba(0, 0, 0, 0.42),
                inset 0 0 0 1px rgba(255, 255, 255, 0.018),
                0 0 65px rgba(124, 58, 237, 0.10);
            backdrop-filter: blur(20px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -1px;
            background:
                radial-gradient(circle at 5% 95%, rgba(22, 199, 232, 0.18), transparent 26%),
                radial-gradient(circle at 94% 4%, rgba(124, 58, 237, 0.18), transparent 28%);
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .photo-section {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .photo-preview {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            overflow: hidden;
            background: radial-gradient(circle at top left, rgba(22, 199, 232, 0.2), transparent 35%),
                rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.08);
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.72);
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-actions {
            display: grid;
            gap: 10px;
        }

        .photo-actions label {
            color: rgba(226, 232, 240, 0.78);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .photo-btn {
            width: max-content;
            align-self: start;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .photo-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.1);
        }

        .photo-note {
            color: rgba(226, 232, 240, 0.6);
            font-size: 0.92rem;
        }

        .photo-input {
            display: none;
        }

        .panel-header {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 110px 1fr 110px;
            align-items: center;
            margin-bottom: 18px;
        }

        .back-btn {
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            background: rgba(255, 255, 255, 0.055);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.02);
            transition: 0.18s ease;
        }

        .back-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.09);
        }

        .panel-title {
            justify-self: center;
            display: grid;
            gap: 10px;
            text-align: center;
        }

        .panel-title h1 {
            margin: 0;
            font-size: clamp(1.75rem, 3vw, 2.2rem);
            line-height: 1;
            letter-spacing: -0.055em;
            font-weight: 850;
        }

        .panel-title p {
            margin: 0;
            color: rgba(226, 232, 240, 0.68);
            font-size: 0.95rem;
        }

        #status-message {
            position: relative;
            z-index: 1;
            margin-bottom: 22px;
        }

        form {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 20px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        label {
            color: rgba(226, 232, 240, 0.72);
            font-size: 1rem;
            font-weight: 750;
        }

        input {
            width: 100%;
            min-height: 56px;
            padding: 16px 20px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.17);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.04));
            color: var(--text);
            font-size: 1.05rem;
            font-weight: 550;
            outline: none;
            transition: 0.18s ease;
            box-shadow: inset 0 0 22px rgba(255, 255, 255, 0.015);
        }

        input::placeholder {
            color: rgba(226, 232, 240, 0.42);
        }

        input:focus {
            border-color: rgba(22, 199, 232, 0.48);
            background: rgba(255, 255, 255, 0.075);
            box-shadow:
                0 0 0 4px rgba(22, 199, 232, 0.08),
                0 0 24px rgba(124, 58, 237, 0.12);
        }

        .field-note {
            color: rgba(226, 232, 240, 0.56);
            font-size: 0.88rem;
        }

        .field-error {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fda4af;
            font-size: 0.92rem;
        }

        .field-error svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .status-banner {
            display: none;
            padding: 16px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(10, 14, 28, 0.85);
            color: var(--text);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
            font-size: 0.96rem;
            backdrop-filter: blur(14px);
        }

        .status-banner.success {
            color: #d1fae5;
            border-color: rgba(34, 197, 94, 0.25);
            background: rgba(16, 35, 21, 0.75);
        }

        .status-banner.error {
            color: #fecaca;
            border-color: rgba(248, 113, 113, 0.25);
            background: rgba(52, 10, 18, 0.75);
        }

        .submit-row {
            margin-top: 2px;
        }

        .submit-row button {
            width: 100%;
            min-height: 66px;
            border: none;
            border-radius: 999px;
            padding: 18px 24px;
            font-size: 1.08rem;
            font-weight: 800;
            color: white;
            cursor: pointer;
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
            box-shadow:
                0 22px 52px rgba(124, 58, 237, 0.26),
                0 0 36px rgba(22, 199, 232, 0.15);
            transition: 0.18s ease;
        }

        .submit-row button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 26px 62px rgba(124, 58, 237, 0.34),
                0 0 46px rgba(22, 199, 232, 0.20);
        }

        @media (max-width: 820px) {
            .page {
                padding: 20px;
            }

            .card {
                padding: 28px;
                border-radius: 26px;
            }

            .panel-header {
                grid-template-columns: 1fr;
                gap: 22px;
            }

            .back-btn {
                justify-self: start;
            }

            .panel-title {
                justify-self: start;
                text-align: left;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <article class="card">
            <div class="panel-header">
                <a class="back-btn" href="/dashboard">
                    <span>&larr;</span> Back
                </a>
                <div class="panel-title">
                    <h1>Edit Account</h1>
                    <p>Update your username, email, and password securely.</p>
                </div>
            </div>

            <div id="status-message" class="status-banner"></div>

            <div class="photo-section">
                <div class="photo-preview" id="profile-photo-preview">AN</div>
                <div class="photo-actions">
                    <label for="profile-photo">Profile photo</label>
                    <button type="button" class="photo-btn" onclick="choosePhoto()">Change photo</button>
                    <span class="photo-note">Upload a square JPG or PNG up to 2MB.</span>
                    <input id="profile-photo" class="photo-input" type="file" accept="image/*">
                </div>
            </div>

            <form id="profile-form" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="JohnDoe" required>
                    <span class="field-note">5-20 characters, no spaces</span>
                </div>
                <div class="field">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="johndoe@email.com" required>
                </div>
                <div class="row">
                    <div class="field">
                        <label for="current-password">Current Password</label>
                        <input id="current-password" type="password" placeholder="••••••••">
                        <span id="current-password-error" class="field-error" style="display:none;">
                            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm.93-11.412a.75.75 0 10-1.86.493l.35 1.25a.75.75 0 00.72.559h.002a.75.75 0 00.73-.556l.058-.248.073-.31a.75.75 0 00-.073-.428zM10 14.25a.75.75 0 01-.75-.75v-1.5a.75.75 0 011.5 0v1.5A.75.75 0 0110 14.25z"
                                    clip-rule="evenodd" />
                            </svg>
                            Incorrect password
                        </span>
                    </div>
                    <div class="field">
                        <label for="new-password">New Password</label>
                        <input id="new-password" type="password" placeholder="••••••••">
                        <span id="new-password-error" class="field-error" style="display:none;">
                            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm.93-11.412a.75.75 0 10-1.86.493l.35 1.25a.75.75 0 00.72.559h.002a.75.75 0 00.73-.556l.058-.248.073-.31a.75.75 0 00-.073-.428zM10 14.25a.75.75 0 01-.75-.75v-1.5a.75.75 0 011.5 0v1.5A.75.75 0 0110 14.25z"
                                    clip-rule="evenodd" />
                            </svg>
                            Passwords do not match
                        </span>
                    </div>
                </div>
                <div class="field">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input id="confirm-new-password" type="password" placeholder="••••••••">
                </div>
                <div class="submit-row">
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </article>
    </div>

    <script>
        const profileToken = localStorage.getItem('token');
        if (!profileToken) window.location.href = '/login';

        const profileHeaders = {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + profileToken,
        };

        let profilePhotoData = null;

        function choosePhoto() {
            document.getElementById('profile-photo').click();
        }

        function setPhotoPreview(src, initials = 'AN') {
            const preview = document.getElementById('profile-photo-preview');
            preview.innerHTML = '';
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                preview.appendChild(img);
                return;
            }
            preview.textContent = initials;
        }

        document.getElementById('profile-photo').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = () => {
                profilePhotoData = reader.result;
                setPhotoPreview(profilePhotoData);
            };
            reader.readAsDataURL(file);
        });

        async function loadProfile() {
            const res = await fetch('/api/auth/me', { headers: profileHeaders });
            if (!res.ok) return window.location.href = '/login';
            const data = await res.json();
            document.getElementById('username').value = data.user.username;
            document.getElementById('email').value = data.user.email;
            const initials = data.user.username ? data.user.username.slice(0, 2).toUpperCase() : 'AN';
            setPhotoPreview(data.user.profilePicture || null, initials);
        }

        function showStatus(message, isError) {
            const status = document.getElementById('status-message');
            status.textContent = message;
            status.className = `status-banner${isError ? ' error' : ' success'}`;
            status.style.display = 'block';
            if (!isError) setTimeout(() => status.style.display = 'none', 5000);
        }

        function clearFieldErrors() {
            document.getElementById('current-password-error').style.display = 'none';
            document.getElementById('new-password-error').style.display = 'none';
        }

        document.getElementById('profile-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            clearFieldErrors();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmNewPassword = document.getElementById('confirm-new-password').value;

            if ((newPassword || confirmNewPassword) && !currentPassword) {
                document.getElementById('current-password-error').style.display = 'inline-flex';
                return;
            }

            if (newPassword && confirmNewPassword && newPassword !== confirmNewPassword) {
                document.getElementById('new-password-error').style.display = 'inline-flex';
                return;
            }

            const body = {};
            if (username) body.username = username;
            if (email) body.email = email;
            if (currentPassword) body.currentPassword = currentPassword;
            if (newPassword) body.newPassword = newPassword;
            if (confirmNewPassword) body.confirmNewPassword = confirmNewPassword;
            if (profilePhotoData) body.profilePicture = profilePhotoData;

            const res = await fetch('/api/auth/account', {
                method: 'PATCH',
                headers: profileHeaders,
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok) {
                if (data.detail?.field === 'currentPassword') {
                    document.getElementById('current-password-error').style.display = 'inline-flex';
                }
                showStatus(data.detail?.error || 'Unable to update profile', true);
                return;
            }
            showStatus('Profile updated successfully.', false);
            if (data.user) {
                document.getElementById('username').value = data.user.username;
                document.getElementById('email').value = data.user.email;
            }
        });

        loadProfile();
    </script>
</body>

</html>
