<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #eef2f7;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --surface-strong: #e2e8f0;
            --text: #172033;
            --muted: #64748b;
            --line: #d7dee8;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --teal: #0f766e;
            --amber: #b45309;
            --danger: #b91c1c;
            --danger-soft: #fee2e2;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.05;
            pointer-events: none;
        }

        .page {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100%;
            gap: 18px;
            padding: 20px;
            overflow: hidden;
        }

        header {
            position: relative;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        header .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header .brand h1 {
            font-size: 1.65rem;
            color: #f8fafc;
            margin: 0;
            letter-spacing: -0.04em;
        }

        header small {
            color: rgba(226, 232, 240, 0.62);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 11px 16px;
            border-radius: 999px;
            color: white;
            font-weight: 800;
            letter-spacing: -0.02em;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.35), rgba(124, 58, 237, 0.42), rgba(236, 72, 153, 0.25));
            box-shadow:
                0 0 22px rgba(6, 182, 212, 0.20),
                0 0 32px rgba(124, 58, 237, 0.18);
        }

        .top-right {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .btn {
            min-height: 36px;
            padding: 0 13px;
            border-radius: 7px;
            background: var(--accent);
            color: #ffffff;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn.secondary {
            color: var(--text);
            background: var(--surface-strong);
        }

        .btn.ghost {
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--line);
        }

        .btn.danger {
            color: #ffffff;
            background: var(--danger);
        }

        .profile-avatar {
            width: 36px;
            height: 36px;
        }

        .profile-name {
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .profile-arrow {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-panel {
            width: min(960px, 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .auth-side {
            padding: 34px;
            background: #102033;
            color: #ffffff;
        }

        .auth-side h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            letter-spacing: 0;
        }

        .auth-side p {
            margin: 0;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .profile-menu-item:hover,
        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .profile-menu-item.red,
        .dropdown-item.red {
            color: #fb7185;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px minmax(520px, 1fr) 380px;
            gap: 18px;
            align-items: stretch;
            height: 100%;
            overflow: hidden;
        }

        .panel {
            background: linear-gradient(160deg, rgba(15, 23, 42, 0.86), rgba(15, 23, 42, 0.62));
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 0;
            overflow: hidden;
            backdrop-filter: blur(18px);
            box-shadow:
                0 26px 80px rgba(0, 0, 0, 0.28),
                inset 0 0 0 1px rgba(255, 255, 255, 0.025);
        }

        .panel h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .input,
        .textarea,
        .select {
            width: 100%;
            min-height: 38px;
            border-radius: 7px;
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--text);
            padding: 9px 11px;
            outline: none;
        }

        .textarea {
            min-height: 76px;
            resize: vertical;
        }

        .input:focus,
        .textarea:focus,
        .select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .toggle-panel {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .list {
            display: grid;
            grid-template-columns: 280px minmax(360px, 1fr) 360px;
            gap: 1px;
            background: var(--line);
        }

        .panel {
            min-width: 0;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-panel {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .item.active {
            border-color: rgba(6, 182, 212, 0.56);
            background:
                linear-gradient(135deg, rgba(6, 182, 212, 0.16), rgba(124, 58, 237, 0.14));
            box-shadow: 0 0 24px rgba(6, 182, 212, 0.08);
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar,
        .message-group-avatar {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
        }

        .chat-title,
        .item-title {
            font-weight: 800;
            color: #f8fafc;
            margin: 0;
        }

        .item-meta {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text);
        }

        .alert.error {
            border-color: rgba(248, 113, 113, 0.28);
            background: rgba(248, 113, 113, 0.12);
            color: #fecaca;
        }

        #message-section {
            flex: 1;
            min-height: 360px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .message-feed {
            display: grid;
            gap: 16px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 6px;
        }

        .message-group {
            display: grid;
            grid-template-columns: 48px 1fr;
            gap: 12px;
            align-items: flex-start;
        }

        .message-group-content {
            display: grid;
            gap: 10px;
        }

        .from {
            color: #67e8f9;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .message {
            position: relative;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.09);
            overflow: visible;
        }

        .message:hover {
            border-color: rgba(124, 58, 237, 0.38);
            background: rgba(255, 255, 255, 0.065);
        }

        .message-body {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
        }

        .message-text {
            flex: 1;
            color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.95rem;
            padding: 13px 15px;
            border-radius: 17px;
            background: rgba(2, 6, 23, 0.58);
        }

        .message-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .chat-list {
            display: grid;
            gap: 8px;
        }

        .message-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 160px;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            padding: 6px 0;
            z-index: 20;
        }

        .message-menu-dropdown.open {
            display: flex;
        }

        .message-menu-dropdown button {
            width: 100%;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text);
            text-align: left;
            padding: 10px;
            border-radius: 8px;
            background: var(--surface-soft);
            border: 1px solid transparent;
        }

        .chat-item.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .chat-name {
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .create-chat-form {
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
        }

        .create-chat-form.collapsed {
            max-height: 0;
            opacity: 0;
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }

        .create-chat-btn {
            min-height: 28px;
            padding: 0 14px;
            border-radius: 16px;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .create-chat-form .btn {
            min-height: 32px;
            padding: 0 12px;
            font-size: 0.9rem;
        }

        .create-chat-form .input {
            min-height: 32px;
            padding: 6px 9px;
        }

        .messages {
            min-height: 0;
            flex: 1;
            overflow: auto;
            padding: 14px;
            background: #f4f7fb;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .message-form textarea {
            flex: 1;
            min-height: 80px;
            max-height: 120px;
            resize: none;
        }

        .menu-btn {
            min-width: 42px;
            min-height: 42px;
            padding: 0 12px;
            border-radius: 18px;
            font-size: 1.5rem;
            line-height: 1;
            letter-spacing: 0.1em;
        }

        .details-panel {
            display: none;
            position: fixed;
            top: 84px;
            right: 20px;
            width: 360px;
            height: calc(100vh - 104px);
            z-index: 50;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(124, 58, 237, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .details-panel.open {
            display: flex;
        }

        .details-panel .tabs {
            position: sticky;
            top: 0;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
        }

        .message-form button[type="submit"] {
            min-width: 145px;
            padding: 13px 16px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        .message.mine {
            align-self: flex-end;
        }

        .bubble {
            padding: 10px 12px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid var(--line);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.mine .bubble {
            color: #ffffff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .message.selected .bubble {
            outline: 3px solid rgba(245, 158, 11, 0.3);
        }

        select option {
            background: #0f172a;
            color: #e2e8f0;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .message-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .composer {
            padding: 12px;
            border-top: 1px solid var(--line);
            background: var(--surface);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
        }

        .status {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 20;
            max-width: min(560px, calc(100vw - 28px));
            padding: 10px 14px;
            border-radius: 8px;
            color: #ffffff;
            background: #172033;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
        }

        .status.error {
            background: var(--danger);
        }

        .empty {
            color: var(--muted);
            font-size: 0.92rem;
            padding: 16px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: var(--surface-soft);
        }

        .member-row,
        .task-row,
        .user-row {
            padding: 9px;
            border-radius: 8px;
            background: var(--surface-soft);
            border: 1px solid var(--line);
            display: grid;
            gap: 5px;
        }

        .participant-name {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .participant-name strong {
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .participant-name span {
            color: var(--muted);
            font-size: 0.82rem;
        }

        .status {
            padding: 7px 11px;
            border-radius: 999px;
            background: var(--surface-strong);
            color: var(--text);
            font-size: 0.74rem;
            font-weight: 800;
            text-transform: capitalize;
        }

        .status.todo {
            background: rgba(6, 182, 212, 0.12);
            color: #67e8f9;
        }

        .status.in_progress {
            background: rgba(236, 72, 153, 0.12);
            color: #f9a8d4;
        }

        .status.blocked {
            background: rgba(251, 191, 36, 0.12);
            color: #fde68a;
        }

        .status.done {
            background: rgba(34, 197, 94, 0.12);
            color: #86efac;
        }

        .chat-menu-container {
            position: relative;
        }

        .checkbox-list {
            max-height: 130px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            display: grid;
            gap: 7px;
            background: #ffffff;
        }

        .dropdown-section {
            padding: 10px 16px;
            display: grid;
            gap: 10px;
        }

        .dropdown-title {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-weight: 800;
            color: #f8fafc;
            font-size: 0.95rem;
        }

        .tab {
            min-height: 34px;
            border-radius: 7px;
            color: var(--muted);
            font-weight: 500;
        }

        .dropdown-list {
            display: grid;
            gap: 8px;
            max-height: 140px;
            overflow: auto;
        }

        .dropdown-list-item {
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            background: var(--surface-strong);
        }

        .dropdown-divider {
            height: 1px;
            margin: 6px 0;
            background: rgba(148, 163, 184, 0.12);
        }

        .task-panel-content {
            display: grid;
            gap: 16px;
        }

        .task-panel-content.collapsed {
            display: none;
        }

        #selected-message {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.10) !important;
            border-radius: 15px !important;
            color: var(--muted);
            min-height: 50px;
            background: rgba(255, 255, 255, 0.035);
        }

        .scroll,
        .message-feed,
        .dropdown-list,
        .participants-dropdown {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
        }

        .scroll::-webkit-scrollbar,
        .message-feed::-webkit-scrollbar,
        .dropdown-list::-webkit-scrollbar,
        .participants-dropdown::-webkit-scrollbar {
            width: 9px;
        }

        .scroll::-webkit-scrollbar-track,
        .message-feed::-webkit-scrollbar-track,
        .dropdown-list::-webkit-scrollbar-track,
        .participants-dropdown::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 999px;
        }

        .scroll::-webkit-scrollbar-thumb,
        .message-feed::-webkit-scrollbar-thumb,
        .dropdown-list::-webkit-scrollbar-thumb,
        .participants-dropdown::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 999px;
        }

        @media (max-width: 1180px) {

            html,
            body {
                overflow: auto;
            }

            .page {
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            .layout {
                grid-template-columns: 1fr;
                height: auto;
                overflow: visible;
            }

            .panel {
                min-height: auto;
                overflow: visible;
            }

            #message-section {
                max-height: 520px;
            }
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            header .brand {
                align-items: flex-start;
            }

            .top-right {
                justify-content: flex-end;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .message-form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .message-form button[type="submit"] {
                width: 100%;
            }
        }

        
    </style>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">T</div>
            <span>TaskFlow</span>
        </div>
        <div class="top-actions">
            <span id="currentUserLabel"></span>
            <span id="socketLabel" class="pill hidden">Offline</span>
            <button id="logoutBtn" class="btn ghost small hidden" type="button">Logout</button>
        </div>
    </header>

    <main id="authPage" class="auth-page hidden">
        <section class="auth-panel">
            <div class="auth-side">
                <h1>TaskFlow</h1>
            </div>
            <div class="auth-forms">
                <form id="loginForm" class="form-block">
                    <h2>Sign in</h2>
                    <div class="field">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" class="input" type="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" class="input" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn" type="submit">Sign in</button>
                </form>

                <form id="registerForm" class="form-block">
                    <h2>Create account</h2>
                    <div class="field">
                        <label for="registerUsername">Username</label>
                        <input id="registerUsername" class="input" type="text" autocomplete="username" required>
                    </div>
                    <p class="footer-note">Select a chat to see messages and tasks.</p>
                </div>

                <div id="chat-list" class="list scroll"></div>

                <div id="create-chat-panel" style="display:none; margin-top:10px;">
                    <div class="item">
                        <h3 class="item-title">Create chat</h3>
                        <form id="create-chat-form" onsubmit="event.preventDefault(); createChat();">
                            <label for="new-chat-name">Chat name</label>
                            <input type="text" id="new-chat-name" placeholder="Team planning" required>
                            <label for="participant-search">Add participants</label>
                            <input type="text" id="participant-search" class="input" placeholder="Search teammates..."
                                oninput="filterParticipants()">
                            <div id="new-chat-participants" class="participants-dropdown"></div>
                            <button class="btn" type="submit">Create chat</button>
                        </form>
                    </div>
                </div>
            </section>

    <main id="appPage" class="app hidden">
        <section class="panel chats-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h2>Chats</h2>
                    <span id="chatCountLabel"></span>
                </div>
                <button id="refreshBtn" class="btn ghost small" type="button">Refresh</button>
            </div>
            <div class="panel-body stack">
                <form id="createChatForm" class="stack">
                    <div class="field">
                        <label for="newChatName">New chat</label>
                        <input id="newChatName" class="input" type="text" placeholder="Project chat">
                    </div>
                    <div class="field">
                        <label>Members</label>
                        <div id="createMembersList" class="checkbox-list"></div>
                    </div>
                    <button class="btn" type="submit">Create chat</button>
                </form>
                <div id="chatList" class="chat-list"></div>
            </div>
        </section>

        <section class="panel messages-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h2 id="activeChatName">No chat selected</h2>
                    <span id="activeChatMeta"></span>
                </div>
                <div class="inline">
                    <button id="leaveChatBtn" class="btn ghost small" type="button" disabled>Leave</button>
                </div>
            </div>
            <div id="messages" class="messages">
                <div class="empty">No chat selected</div>
            </div>
            <form id="messageForm" class="composer">
                <input id="messageInput" class="input" type="text" placeholder="Message" disabled>
                <button id="sendMessageBtn" class="btn" type="submit" disabled>Send</button>
            </form>
        </section>

        <section class="panel details-panel">
            <div class="tabs">
                <button id="membersTab" class="tab active" type="button">Members</button>
                <button id="tasksTab" class="tab" type="button">Tasks</button>
            </div>

                <form id="message-form" class="message-form" onsubmit="event.preventDefault(); sendMessage();">
                    <label for="message-input">New message</label>
                    <div class="message-form-row">
                        <textarea id="message-input" placeholder="Type a message..." required
                            onkeydown="handleMessageKeydown(event)"></textarea>
                        <button class="btn" type="submit">Send message</button>
                    </div>
                </form>
            </section>

            <section class="panel scroll">
                <div class="task-panel-header">
                    <div>
                        <h2>Tasks</h2>
                        <p class="footer-note">Create tasks from messages and keep track of work for this chat.</p>
                    </div>
                    <button class="toggle-panel" id="toggle-task-panel-btn" type="button"
                        onclick="toggleTaskPanel()">New task ▾</button>
                </div>

                <form id="addMemberForm" class="stack">
                    <div class="field">
                        <label for="addMemberSelect">Add member</label>
                        <div class="split">
                            <select id="addMemberSelect" class="select" disabled></select>
                            <button id="addMemberBtn" class="btn secondary" type="submit" disabled>Add</button>
                        </div>
                    </div>
                </form>
            </div>

            <div id="tasksPane" class="panel-body stack hidden">
                <form id="taskForm" class="stack">
                    <div class="inline wrap">
                        <span id="taskFormMode" class="pill">New task</span>
                        <button id="newTaskBtn" class="btn ghost small" type="button" disabled>New task</button>
                    </div>
                    <div class="field">
                        <label>Source message</label>
                        <div class="split">
                            <div id="selectedMessageLabel" class="empty">Standalone task</div>
                            <button id="clearTaskSourceBtn" class="btn ghost small" type="button" disabled>Clear</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="taskTitle">Title</label>
                        <input id="taskTitle" class="input" type="text" disabled>
                    </div>
                    <div class="field">
                        <label for="taskDescription">Description</label>
                        <textarea id="taskDescription" class="textarea" disabled></textarea>
                    </div>
                    <div class="field">
                        <label for="taskDeadline">Deadline</label>
                        <input id="taskDeadline" class="input" type="datetime-local" disabled>
                    </div>
                    <div class="inline">
                        <div class="field" style="flex: 1;">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority" class="select" disabled>
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                        <div class="field" style="flex: 1;">
                            <label for="taskStatus">Status</label>
                            <select id="taskStatus" class="select" disabled>
                                <option value="todo" selected>Todo</option>
                                <option value="in_progress">In progress</option>
                                <option value="blocked">Blocked</option>
                                <option value="done">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="taskCategorySelect">Category</label>
                        <select id="taskCategorySelect" class="select" disabled></select>
                    </div>
                    <div id="taskNewCategoryField" class="field hidden">
                        <label for="taskNewCategory">New category</label>
                        <input id="taskNewCategory" class="input" type="text" disabled>
                    </div>
                    <div class="field">
                        <label>Assignees</label>
                        <div id="taskAssigneesList" class="checkbox-list"></div>
                    </div>
                    <button id="createTaskBtn" class="btn" type="submit" disabled>Create task</button>
                </form>
                <div id="tasksList" class="stack"></div>
            </div>
        </section>
    </main>

    <div id="status" class="status hidden"></div>

    <script>
        const token = localStorage.getItem('token');
        let currentUser = null;
        let chats = [];
        let users = [];
        let selectedChat = null;
        let participants = [];
        let messages = [];
        let tasks = [];
        let selectedMessage = null;
        let ws = null;
        let messageFormVisible = false;
        let taskPanelOpen = false;

        const el = {
            authPage: document.getElementById('authPage'),
            appPage: document.getElementById('appPage'),
            currentUserLabel: document.getElementById('currentUserLabel'),
            socketLabel: document.getElementById('socketLabel'),
            logoutBtn: document.getElementById('logoutBtn'),
            loginForm: document.getElementById('loginForm'),
            registerForm: document.getElementById('registerForm'),
            refreshBtn: document.getElementById('refreshBtn'),
            chatCountLabel: document.getElementById('chatCountLabel'),
            createChatForm: document.getElementById('createChatForm'),
            createMembersList: document.getElementById('createMembersList'),
            newChatName: document.getElementById('newChatName'),
            chatList: document.getElementById('chatList'),
            activeChatName: document.getElementById('activeChatName'),
            activeChatMeta: document.getElementById('activeChatMeta'),
            leaveChatBtn: document.getElementById('leaveChatBtn'),
            messages: document.getElementById('messages'),
            messageForm: document.getElementById('messageForm'),
            messageInput: document.getElementById('messageInput'),
            sendMessageBtn: document.getElementById('sendMessageBtn'),
            membersTab: document.getElementById('membersTab'),
            tasksTab: document.getElementById('tasksTab'),
            membersPane: document.getElementById('membersPane'),
            tasksPane: document.getElementById('tasksPane'),
            renameChatForm: document.getElementById('renameChatForm'),
            renameChatName: document.getElementById('renameChatName'),
            renameChatBtn: document.getElementById('renameChatBtn'),
            deleteChatBtn: document.getElementById('deleteChatBtn'),
            participantsList: document.getElementById('participantsList'),
            addMemberForm: document.getElementById('addMemberForm'),
            addMemberSelect: document.getElementById('addMemberSelect'),
            addMemberBtn: document.getElementById('addMemberBtn'),
            taskForm: document.getElementById('taskForm'),
            taskFormMode: document.getElementById('taskFormMode'),
            newTaskBtn: document.getElementById('newTaskBtn'),
            selectedMessageLabel: document.getElementById('selectedMessageLabel'),
            clearTaskSourceBtn: document.getElementById('clearTaskSourceBtn'),
            taskTitle: document.getElementById('taskTitle'),
            taskDescription: document.getElementById('taskDescription'),
            taskDeadline: document.getElementById('taskDeadline'),
            taskPriority: document.getElementById('taskPriority'),
            taskStatus: document.getElementById('taskStatus'),
            taskCategorySelect: document.getElementById('taskCategorySelect'),
            taskNewCategoryField: document.getElementById('taskNewCategoryField'),
            taskNewCategory: document.getElementById('taskNewCategory'),
            taskAssigneesList: document.getElementById('taskAssigneesList'),
            createTaskBtn: document.getElementById('createTaskBtn'),
            tasksList: document.getElementById('tasksList'),
            status: document.getElementById('status')
        };

        function showStatus(message, type = 'info') {
            el.status.textContent = message;
            el.status.className = `status ${type === 'error' ? 'error' : ''}`;
            el.status.classList.remove('hidden');
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => el.status.classList.add('hidden'), 3200);
        }

        async function loadUsers() {
            const res = await fetch('/api/auth/users', { headers });
            if (!res.ok) return;
            users = await res.json();
            renderCreateChatParticipants();
        }

        async function loadChats() {
            const res = await fetch('/api/chats', { headers });
            if (!res.ok) return;
            const data = await res.json();
            chats = data.chats || [];
            renderChatList();
        }

        async function selectChat(chatId) {
            selectedChat = chats.find((c) => c.id === chatId) || null;
            selectedMessage = null;
            await Promise.all([loadChatParticipants(chatId), loadChatMessages(chatId), loadChatTasks(chatId)]);
            renderChatSelection();
            connectWebSocket(chatId);
            renderMessageControls();
            renderTaskPanel();
        }

        async function loadChatParticipants(chatId) {
            const res = await fetch(`/api/chats/${chatId}/participants`, { headers });
            if (res.ok) {
                const data = await res.json();
                participants = data.participants || [];
                renderParticipants();
            }
        }

        async function reloadAll() {
            const [usersData, chatsData] = await Promise.all([
                api('/api/auth/users'),
                api('/api/chats')
            ]);
            state.users = usersData;
            state.chats = chatsData.chats || [];
            renderUsers();
            renderChats();
            if (state.selectedChat) {
                const updatedChat = state.chats.find(chat => chat.id === state.selectedChat.id);
                if (updatedChat) {
                    await selectChat(updatedChat.id, false);
                } else {
                    clearSelection();
                }
            }
        }

        function renderUsers() {
            const otherUsers = state.users.filter(user => user.id !== state.user?.id);
            el.createMembersList.innerHTML = otherUsers.length
                ? otherUsers.map(user => `
                    <label class="check-row">
                        <input type="checkbox" value="${user.id}" data-create-member>
                        <span>${escapeHtml(user.username)} <span class="muted">${escapeHtml(user.email)}</span></span>
                    </label>
                `).join('')
                : '<div class="muted">No other users</div>';
        }

        function renderChats() {
            el.chatCountLabel.textContent = `${state.chats.length} total`;
            el.chatList.innerHTML = state.chats.length
                ? state.chats.map(chat => {
                    const active = state.selectedChat?.id === chat.id ? 'active' : '';
                    const lastMessage = chat.lastMessage ? chat.lastMessage.content : 'No messages';
                    return `
                        <button class="chat-item ${active}" type="button" data-chat-id="${chat.id}">
                            <div class="chat-name">${escapeHtml(chat.name)}</div>
                            <div class="chat-meta">${chat.participantCount} members - ${escapeHtml(lastMessage)}</div>
                        </button>
                    `;
                }).join('')
                : '<div class="empty">No chats</div>';
        }

        async function selectChat(chatId, showToast = true) {
            closeSocket();
            const [chatData, messagesData, tasksData, categoriesData] = await Promise.all([
                api(`/api/chats/${chatId}`),
                api(`/api/chats/${chatId}/messages?limit=100`),
                api(`/api/chats/${chatId}/tasks`),
                api(`/api/chats/${chatId}/task-categories`)
            ]);

            state.selectedChat = chatData.chat;
            state.participants = chatData.chat.participants || [];
            state.messages = messagesData.messages || [];
            state.tasks = tasksData.tasks || [];
            state.categories = categoriesData.categories || [];
            state.selectedMessage = null;
            state.editingTask = null;

            connectSocket(chatId);
            renderChats();
            renderActiveChat();
            renderMessages();
            renderMembers();
            renderTaskForm();
            renderTasks();

            if (showToast) showStatus('Chat opened');
        }

        function clearSelection() {
            closeSocket();
            state.selectedChat = null;
            state.participants = [];
            state.messages = [];
            state.tasks = [];
            state.categories = [];
            state.selectedMessage = null;
            state.editingTask = null;
            renderChats();
            renderActiveChat();
            renderMessages();
            renderMembers();
            renderTaskForm();
            renderTasks();
        }

        function renderActiveChat() {
            const hasChat = Boolean(state.selectedChat);
            el.activeChatName.textContent = hasChat ? state.selectedChat.name : 'No chat selected';
            el.activeChatMeta.textContent = hasChat
                ? `${state.participants.length} members`
                : '';
            el.renameChatName.value = hasChat ? state.selectedChat.name : '';
            el.messageInput.disabled = !hasChat;
            el.sendMessageBtn.disabled = !hasChat;
            el.leaveChatBtn.disabled = !hasChat;

            const isOwner = hasChat && state.selectedChat.createdBy === state.user?.id;
            el.renameChatName.disabled = !isOwner;
            el.renameChatBtn.disabled = !isOwner;
            el.deleteChatBtn.disabled = !isOwner;
            el.addMemberSelect.disabled = !isOwner;
            el.addMemberBtn.disabled = !isOwner;
        }

        function renderMessages() {
            if (!state.selectedChat) {
                el.messages.innerHTML = '<div class="empty">No chat selected</div>';
                return;
            }
            if (!state.messages.length) {
                el.messages.innerHTML = '<div class="empty">No messages</div>';
                return;
            }

            const ownerId = state.selectedChat.createdBy;
            el.messages.innerHTML = state.messages.map(message => {
                const isMine = message.senderId === state.user.id;
                const canDelete = isMine || ownerId === state.user.id;
                const selected = state.selectedMessage?.id === message.id ? 'selected' : '';
                return `
                    <article class="message ${isMine ? 'mine' : ''} ${selected}" data-message-id="${message.id}">
                        <div class="message-meta">
                            <span>${escapeHtml(userName(message.senderId))} - ${formatDate(message.sentAt)}</span>
                        </div>
                        <div class="bubble">${escapeHtml(message.content)}</div>
                        <div class="message-actions">
                            <button class="btn ghost small" type="button" data-task-message="${message.id}">Task</button>
                            ${isMine ? `<button class="btn ghost small" type="button" data-edit-message="${message.id}">Edit</button>` : ''}
                            ${canDelete ? `<button class="btn ghost small" type="button" data-delete-message="${message.id}">Delete</button>` : ''}
                        </div>
                    </article>
                `;
            }).join('');
            el.messages.scrollTop = el.messages.scrollHeight;
        }

        function renderMembers() {
            if (!state.selectedChat) {
                el.participantsList.innerHTML = '<div class="empty">No chat selected</div>';
                el.addMemberSelect.innerHTML = '';
                return;
            }
            messageFormVisible = true;
            form.classList.add('open');
            document.getElementById('message-input').focus();
        }

        function renderTaskPanel() {
            const content = document.getElementById('task-panel-content');
            const button = document.getElementById('toggle-task-panel-btn');
            if (!taskPanelOpen) {
                content.classList.add('collapsed');
                button.textContent = 'New task ▸';
            } else {
                content.classList.remove('collapsed');
                button.textContent = 'New task ▾';
            }
        }

        function toggleMessageForm() {
            // no-op: message input opens automatically when a chat is selected
        }

        function toggleChatMenu() {
            if (!selectedChat) return;
            const menu = document.getElementById('chat-menu');
            const button = document.getElementById('chat-menu-btn');
            if (!menu || !button) return;
            const expanded = menu.classList.toggle('open');
            button.setAttribute('aria-expanded', expanded);
        }

        function closeChatMenu() {
            const menu = document.getElementById('chat-menu');
            const button = document.getElementById('chat-menu-btn');
            if (!menu) return;
            menu.classList.remove('open');
            if (button) button.setAttribute('aria-expanded', 'false');
        }

        function renderChatMenu() {
            const countEl = document.getElementById('chat-participant-count');
            const listEl = document.getElementById('chat-participant-list');
            const button = document.getElementById('chat-menu-btn');
            if (!countEl || !listEl || !button) return;
            if (!selectedChat) {
                button.style.display = 'none';
                countEl.textContent = '0';
                listEl.innerHTML = '<div class="dropdown-list-item">No chat selected.</div>';
                closeChatMenu();
                return;
            }
            button.style.display = 'inline-flex';
            countEl.textContent = `${participants.length}`;
            if (!participants.length) {
                listEl.innerHTML = '<div class="dropdown-list-item">No participants yet.</div>';
            } else {
                listEl.innerHTML = participants
                    .map((user) => `<div class="dropdown-list-item">${escapeHtml(user.username)}</div>`)
                    .join('');
            }
        }

        function openChatSettings() {
            closeChatMenu();
            if (!selectedChat) {
                alert('Select a chat first to open its settings.');
                return;
            }
            window.location.href = `/chat-settings/${selectedChat.id}`;
        }

        function toggleMute() {
            closeChatMenu();
            alert('Mute notifications not implemented yet.');
        }

        function deleteChat() {
            closeChatMenu();
            alert('Delete chat not implemented yet.');
        }

        function toggleTaskPanel() {
            taskPanelOpen = !taskPanelOpen;
            renderTaskPanel();
        }

        function toggleMessageMenu(event, messageId) {
            event.stopPropagation();
            closeMessageMenus();
            const menu = document.getElementById(`message-menu-${messageId}`);
            if (!menu) return;
            menu.classList.toggle('open');
        }

        function closeMessageMenus() {
            document.querySelectorAll('.message-menu-dropdown.open').forEach((menu) => menu.classList.remove('open'));
        }

        function editMessage(messageId) {
            closeMessageMenus();
            alert(`Edit message ${messageId} not implemented yet.`);
        }

        function deleteMessage(messageId) {
            closeMessageMenus();
            alert(`Delete message ${messageId} not implemented yet.`);
        }

        function pinMessage(messageId) {
            closeMessageMenus();
            alert(`Pin message ${messageId} not implemented yet.`);
        }

        function connectWebSocket(chatId) {
            if (!chatId || !token) return;
            if (ws) {
                ws.close();
                ws = null;
            }

            const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
            const url = `${scheme}://${location.host}/ws/${chatId}?token=${token}`;
            ws = new WebSocket(url);

            ws.addEventListener('message', (event) => {
                const payload = JSON.parse(event.data);
                if (payload.type === 'message_created') {
                    addMessageIfNew(payload.message);
                }
                if (payload.type === 'task_created') {
                    addTaskIfNew(payload.task);
                }
            });

            ws.addEventListener('close', () => {
                ws = null;
            });
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';

            if (!chats.length) {
                list.innerHTML = '<div class="alert">No chats yet. Create one to get started.</div>';
                return;
            }

            chats.forEach((chat) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `item${selectedChat?.id === chat.id ? ' active' : ''}`;
                item.onclick = () => selectChat(chat.id);
                item.innerHTML = `
                    <div class="chat-item">
                        <div class="chat-avatar">${escapeHtml(getInitials(chat.name))}</div>
                        <div>
                            <div class="chat-title">${escapeHtml(chat.name)}</div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        let participantSearchTerm = '';

        function renderCreateChatParticipants() {
            const container = document.getElementById('new-chat-participants');
            if (!container) return;
            container.innerHTML = '';
            const filtered = users.filter((user) => {
                if (user.id === currentUser.id) return false;
                const term = participantSearchTerm.trim().toLowerCase();
                return !term || user.username.toLowerCase().includes(term);
            });
            if (!filtered.length) {
                container.innerHTML = '<div class="alert">No teammates match your search.</div>';
                return;
            }
            filtered.forEach((user) => {
                const item = document.createElement('label');
                item.className = 'participant-option';
                item.htmlFor = `participant-${user.id}`;
                item.innerHTML = `
                    <input type="checkbox" id="participant-${user.id}" value="${user.id}">
                    <div class="participant-avatar">${escapeHtml(getInitials(user.username))}</div>
                    <div class="participant-name">
                        <strong>${escapeHtml(user.username)}</strong>
                        <span>Tap to add</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function filterParticipants() {
            participantSearchTerm = document.getElementById('participant-search').value || '';
            renderCreateChatParticipants();
        }

        function getInitials(name) {
            if (!name) return '';
            const parts = name.split(/\s+/).filter(Boolean);
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function renderChatPlaceholder() {
            document.getElementById('chat-title').textContent = 'No chat selected';
            document.getElementById('chat-meta').textContent = 'Create a chat or pick one from the list.';
            document.getElementById('messages').innerHTML = '<div class="alert">No chat selected. Pick a chat to view this space.</div>';
            document.getElementById('task-list').innerHTML = '<div class="alert">Select a chat to view tasks.</div>';
            document.getElementById('selected-message').textContent = 'Pick a message and click "Use as task source".';
            messageFormVisible = false;
            renderChatList();
            renderMessageControls();
            renderTaskPanel();
            renderChatMenu();
        }

        function renderChatSelection() {
            if (!selectedChat) {
                renderChatPlaceholder();
                return;
            }
            document.getElementById('chat-title').textContent = selectedChat.name;
            document.getElementById('chat-meta').textContent = `Created ${new Date(selectedChat.createdAt).toLocaleDateString()}, ${new Date(selectedChat.createdAt).toLocaleTimeString()}`;
            renderChatList();
            renderParticipants();
            renderMessages();
            renderTasks();
            updateSelectedMessageDisplay();
            renderMessageControls();
            renderTaskPanel();
            renderChatMenu();
            scrollToChatPosition();
            markChatRead();
        }

        function renderParticipants() {
            const assigneeSelect = document.getElementById('task-assignees');
            assigneeSelect.innerHTML = '';
            participants.forEach((user) => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `${user.username}`;
                assigneeSelect.appendChild(option);
            });
            renderChatMenu();
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            if (!selectedChat) {
                container.innerHTML = '';
                return;
            }
            if (!messages.length) {
                container.innerHTML = '<div class="alert">No messages in this chat yet. Send the first message below.</div>';
                return;
            }
            container.innerHTML = '';
            let currentSender = null;
            let groupContent = null;

            messages.forEach((message) => {
                const author = getUserName(message.senderId);
                const isNewGroup = message.senderId !== currentSender;
                if (isNewGroup) {
                    currentSender = message.senderId;
                    const group = document.createElement('div');
                    group.className = 'message-group';

                    const avatar = document.createElement('div');
                    avatar.className = 'message-group-avatar';
                    avatar.textContent = escapeHtml(getInitials(author));

                    groupContent = document.createElement('div');
                    groupContent.className = 'message-group-content';

                    const authorLabel = document.createElement('div');
                    authorLabel.className = 'from';
                    authorLabel.textContent = escapeHtml(author);
                    authorLabel.style.marginBottom = '4px';

                    groupContent.appendChild(authorLabel);
                    group.appendChild(avatar);
                    group.appendChild(groupContent);
                    container.appendChild(group);
                }

                const item = document.createElement('div');
                item.className = 'message';
                item.dataset.messageId = message.id;
                item.innerHTML = `
                    <div class="message-body">
                        <div class="message-text">${escapeHtml(message.content)}</div>
                        <div class="message-actions">
                            <button type="button" class="task-source-btn" onclick="selectMessage(${message.id})">Use</button>
                            <div class="message-menu">
                                <button type="button" class="message-menu-button" onclick="toggleMessageMenu(event, ${message.id})">⋯</button>
                                <div class="message-menu-dropdown" id="message-menu-${message.id}">
                                    <button type="button" onclick="editMessage(${message.id})">Edit</button>
                                    <button type="button" onclick="deleteMessage(${message.id})">Delete</button>
                                    <button type="button" onclick="pinMessage(${message.id})">Pin</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                groupContent.appendChild(item);
            });
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            if (!selectedChat) {
                list.innerHTML = '<div class="alert">Select a chat to view tasks.</div>';
                return;
            }
            if (!tasks.length) {
                list.innerHTML = '<div class="alert">No tasks yet. Use a message to create the first task.</div>';
                return;
            }
            tasks.forEach((task) => {
                const item = document.createElement('div');
                item.className = 'item';
                const assigneesText = task.assigneeIds.length ? task.assigneeIds.map(getUserName).join(', ') : 'None';
                item.innerHTML = `<div class="item-title">${escapeHtml(task.title)}</div>
                    <div class="item-meta">${escapeHtml(task.description || '')}</div>
                    <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;">
                        <span class="status ${task.status}">${task.status.replace('_', ' ')}</span>
                        <span>${new Date(task.dueDate).toLocaleDateString()}</span>
                    </div>
                    <div class="item-meta">Priority: ${escapeHtml(task.priority)} • Assignees: ${escapeHtml(assigneesText)}</div>`;
                list.appendChild(item);
            });
        }

        function selectMessage(messageId) {
            selectedMessage = messages.find((m) => m.id === messageId) || null;
            updateSelectedMessageDisplay();
        }

        function updateSelectedMessageDisplay() {
            const selected = document.getElementById('selected-message');
            if (!selectedMessage) {
                selected.textContent = 'Pick a message and click "Use as task source".';
                return;
            }
            selected.innerHTML = `<strong>${escapeHtml(getUserName(selectedMessage.senderId))}</strong>: ${escapeHtml(selectedMessage.content)}`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        el.loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            try {
                const data = await api('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                state.token = data.token;
                localStorage.setItem('token', state.token);
                showStatus('Signed in');
                await boot();
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.registerForm.addEventListener('submit', async event => {
            event.preventDefault();
            try {
                await api('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: document.getElementById('registerUsername').value,
                        email: document.getElementById('registerEmail').value,
                        password: document.getElementById('registerPassword').value,
                        confirmPassword: document.getElementById('registerConfirm').value,
                        acceptTerms: document.getElementById('registerTerms').checked
                    })
                });
                showStatus('Account created');
                el.registerForm.reset();
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.logoutBtn.addEventListener('click', () => {
            closeSocket();
            localStorage.removeItem('token');
            state.token = null;
            state.user = null;
            clearSelection();
            setAuthMode(false);
            el.currentUserLabel.textContent = '';
            showStatus('Logged out');
        });

        el.refreshBtn.addEventListener('click', async () => {
            try {
                await reloadAll();
                showStatus('Refreshed');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.createChatForm.addEventListener('submit', async event => {
            event.preventDefault();
            const ids = Array.from(document.querySelectorAll('[data-create-member]:checked')).map(input => Number(input.value));
            try {
                const data = await api('/api/chats', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: el.newChatName.value,
                        participant_ids: ids
                    })
                });
                el.createChatForm.reset();
                await reloadAll();
                await selectChat(data.chat.id);
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.chatList.addEventListener('click', async event => {
            const button = event.target.closest('[data-chat-id]');
            if (!button) return;
            try {
                await selectChat(Number(button.dataset.chatId));
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.messageForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (!state.selectedChat) return;
            const content = el.messageInput.value.trim();
            if (!content) return;
            el.messageInput.value = '';

            try {
                if (state.ws && state.socketReady) {
                    state.ws.send(JSON.stringify({ type: 'send_message', content }));
                } else {
                    const data = await api(`/api/chats/${state.selectedChat.id}/messages`, {
                        method: 'POST',
                        body: JSON.stringify({ content })
                    });
                    upsertMessage(data.message);
                    renderMessages();
                }
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.messages.addEventListener('click', async event => {
            const taskButton = event.target.closest('[data-task-message]');
            const editButton = event.target.closest('[data-edit-message]');
            const deleteButton = event.target.closest('[data-delete-message]');

            if (taskButton) {
                const message = state.messages.find(item => item.id === Number(taskButton.dataset.taskMessage));
                state.selectedMessage = message || null;
                if (!state.editingTask) {
                    el.taskTitle.value = message ? message.content.slice(0, 70) : '';
                    el.taskDescription.value = message ? message.content : '';
                }
                setPane('tasks');
                renderMessages();
                renderTaskForm();
                return;
            }

            if (editButton) {
                const message = state.messages.find(item => item.id === Number(editButton.dataset.editMessage));
                if (!message) return;
                const content = window.prompt('Edit message', message.content);
                if (content === null) return;
                try {
                    const data = await api(`/api/chats/${state.selectedChat.id}/messages/${message.id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({ content })
                    });
                    upsertMessage(data.message);
                    renderMessages();
                } catch (error) {
                    showStatus(error.message, 'error');
                }
                return;
            }

            if (deleteButton) {
                const messageId = Number(deleteButton.dataset.deleteMessage);
                if (!window.confirm('Delete this message?')) return;
                try {
                    await api(`/api/chats/${state.selectedChat.id}/messages/${messageId}`, { method: 'DELETE' });
                    state.messages = state.messages.filter(message => message.id !== messageId);
                    renderMessages();
                } catch (error) {
                    showStatus(error.message, 'error');
                }
            }
        });

        el.renameChatForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (!state.selectedChat) return;
            try {
                const data = await api(`/api/chats/${state.selectedChat.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ name: el.renameChatName.value })
                });
                state.selectedChat = data.chat;
                await reloadAll();
                renderActiveChat();
                showStatus('Chat renamed');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.deleteChatBtn.addEventListener('click', async () => {
            if (!state.selectedChat || !window.confirm('Delete this chat?')) return;
            try {
                await api(`/api/chats/${state.selectedChat.id}`, { method: 'DELETE' });
                clearSelection();
                await reloadAll();
                showStatus('Chat deleted');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.leaveChatBtn.addEventListener('click', async () => {
            if (!state.selectedChat || !window.confirm('Leave this chat?')) return;
            try {
                await api(`/api/chats/${state.selectedChat.id}/participants/me`, { method: 'DELETE' });
                clearSelection();
                await reloadAll();
                showStatus('Left chat');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.addMemberForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (!state.selectedChat || !el.addMemberSelect.value) return;
            try {
                const data = await api(`/api/chats/${state.selectedChat.id}/participants`, {
                    method: 'POST',
                    body: JSON.stringify({ user_id: Number(el.addMemberSelect.value) })
                });
                state.selectedChat = data.chat;
                state.participants = data.chat.participants || [];
                renderMembers();
                renderActiveChat();
                await reloadAll();
                showStatus('Member added');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.participantsList.addEventListener('click', async event => {
            const button = event.target.closest('[data-remove-member]');
            if (!button || !state.selectedChat) return;
            const userId = Number(button.dataset.removeMember);
            if (!window.confirm(`Remove ${userName(userId)}?`)) return;
            try {
                await api(`/api/chats/${state.selectedChat.id}/participants/${userId}`, { method: 'DELETE' });
                await selectChat(state.selectedChat.id, false);
                showStatus('Member removed');
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        el.tasksList.addEventListener('click', event => {
            const button = event.target.closest('[data-edit-task]');
            if (!button) return;
            const task = state.tasks.find(item => item.id === Number(button.dataset.editTask));
            if (!task) return;
            if (task.creatorId !== state.user.id) {
                showStatus('Only the creator can edit this task', 'error');
                return;
            }
            if (chatMenu && chatButton && (chatMenu.contains(event.target) || chatButton.contains(event.target))) {
                return;
            }
            if (messageMenu) {
                return;
            }
            closeProfileMenu();
            closeChatMenu();
            closeMessageMenus();
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }
    </script>
</body>

</html>
